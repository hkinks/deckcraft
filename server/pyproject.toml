[project]
name = "deckcraft-server"
version = "0.1.0"
description = "DeckCraft agent backend: accounts, LLM agent loop, WebSocket to the web editor"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "anthropic>=0.70",
    "openai>=1.60",
    "aiosqlite>=0.20",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
    "pydantic>=2.9",
    "httpx>=0.27",
    "pypdf>=5",
    "claude-agent-sdk>=0.2.174",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deckcraft_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
