<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>DeckCraft</title>
  <link data-trunk rel="rust" data-bin="deckcraft-web" data-wasm-opt="z" data-weak-refs />
  <link data-trunk rel="icon" href="../../assets/app-icon/hicolor/32x32/apps/ai.storyteller.deckcraft.png" />
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #262626; }
    #deckcraft_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #deckcraft_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #b8b8b8; font: 14px system-ui, sans-serif; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="deckcraft_canvas"></canvas>
  <div id="deckcraft_loading">Loading DeckCraft&hellip;</div>
  <script>
    // Autosaved copies of unsaved presentations (see crates/ui-egui/src/autosave.rs), in IndexedDB:
    // one record per presentation, {key, title, savedAt, owner, bytes: Uint8Array of a .deckcraft file}.
    // Each tab marks its copies with its id and holds a Web Lock named after it for as long as it
    // lives (the browser releases it when the tab closes or crashes; background-tab timer
    // throttling can't make it look dead). A tab offers to restore only copies whose tab is gone.
    window.deckcraftRecovery = (() => {
      const tab = (crypto.randomUUID && crypto.randomUUID()) || String(Math.random()).slice(2);
      const lockName = id => "deckcraft-tab:" + id;
      const locks = navigator.locks;
      if (locks) locks.request(lockName(tab), () => new Promise(() => {}));
      const liveTabs = async () => {
        if (!locks) return new Set();
        const q = await locks.query();
        return new Set((q.held || []).map(l => l.name));
      };
      let db = null;
      const open = () => db ?? (db = new Promise((resolve, reject) => {
        const r = indexedDB.open("deckcraft-recovery", 1);
        r.onupgradeneeded = () => r.result.createObjectStore("decks", { keyPath: "key" });
        r.onsuccess = () => resolve(r.result);
        r.onerror = () => reject(r.error);
      }));
      const tx = async (mode, fn) => {
        const d = await open();
        return new Promise((resolve, reject) => {
          const t = d.transaction("decks", mode);
          const req = fn(t.objectStore("decks"));
          t.oncomplete = () => resolve(req && req.result);
          t.onerror = () => reject(t.error);
        });
      };
      return {
        put: (key, title, savedAt, bytes) => tx("readwrite", s => s.put({ key, title, savedAt, owner: tab, bytes })),
        del: key => tx("readwrite", s => s.delete(key)),
        // Copies left behind by tabs that are gone (copies from older builds have no owner).
        list: async () => {
          const live = await liveTabs();
          return (await tx("readonly", s => s.getAll())).filter(e => !e.owner || (e.owner !== tab && !live.has(lockName(e.owner))));
        },
        all: () => tx("readonly", s => s.getAll()),
      };
    })();
  </script>
  <script>
    // The workspace folder (see crates/ui-egui/src/workspace.rs), through the File System Access
    // API (Chromium). The folder's handle is kept in IndexedDB, so the next visit can offer to
    // read it again (the browser asks the person first). Read-only.
    window.deckcraftWorkspace = (() => {
      const supported = typeof window.showDirectoryPicker === "function";
      let handle = null;
      const db = () => new Promise((res, rej) => {
        const r = indexedDB.open("deckcraft-workspace", 1);
        r.onupgradeneeded = () => r.result.createObjectStore("h");
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      });
      const store = async h => {
        const d = await db();
        await new Promise((res, rej) => {
          const t = d.transaction("h", "readwrite");
          if (h) t.objectStore("h").put(h, "dir"); else t.objectStore("h").delete("dir");
          t.oncomplete = res;
          t.onerror = () => rej(t.error);
        });
      };
      const stored = async () => {
        const d = await db();
        return new Promise((res, rej) => {
          const q = d.transaction("h").objectStore("h").get("dir");
          q.onsuccess = () => res(q.result || null);
          q.onerror = () => rej(q.error);
        });
      };
      // Hidden files and tool folders aren't materials.
      const skip = name => name.startsWith(".") || name === "node_modules" || name === "__pycache__";
      const MAX = 3000;
      async function walk(dir, prefix, out) {
        for await (const [name, h] of dir.entries()) {
          if (out.length >= MAX) return;
          if (skip(name)) continue;
          if (h.kind === "directory") await walk(h, prefix + name + "/", out);
          else out.push({ path: prefix + name, size: (await h.getFile()).size });
        }
      }
      async function fileAt(path) {
        const parts = path.split("/");
        let dir = handle;
        for (const seg of parts.slice(0, -1)) dir = await dir.getDirectoryHandle(seg);
        return (await dir.getFileHandle(parts[parts.length - 1])).getFile();
      }
      return {
        supported,
        pick: async () => {
          handle = await window.showDirectoryPicker({ mode: "read", id: "deckcraft-workspace" });
          await store(handle);
          return handle.name;
        },
        // {name, granted} for the folder chosen on an earlier visit, or null.
        remembered: async () => {
          if (!supported) return null;
          const h = await stored();
          if (!h) return null;
          handle = h;
          return { name: h.name, granted: (await h.queryPermission({ mode: "read" })) === "granted" };
        },
        reconnect: async () => handle && (await handle.requestPermission({ mode: "read" })) === "granted",
        forget: async () => { handle = null; await store(null); },
        list: async () => {
          const out = [];
          await walk(handle, "", out);
          out.sort((a, b) => a.path.localeCompare(b.path));
          return out;
        },
        read: async path => new Uint8Array(await (await fileAt(path)).arrayBuffer()),
      };
    })();
  </script>
</body>
</html>
